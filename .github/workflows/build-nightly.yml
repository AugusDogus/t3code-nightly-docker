name: Build T3 Code nightly

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      t3_version:
        description: Exact T3 npm version. Empty uses the nightly dist-tag.
        required: false
        type: string
  pull_request:
    paths:
      - Dockerfile
      - scripts/smoke.sh
      - .github/workflows/build-nightly.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: t3code-nightly-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image and T3 version
        id: resolve
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.t3_version || '' }}
        run: |
          set -euo pipefail

          version="$REQUESTED_VERSION"
          if [[ -z "$version" ]]; then
            version="$(npm view t3 dist-tags.nightly)"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+$ ]]; then
            echo "Unexpected T3 nightly version: $version" >&2
            exit 1
          fi

          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/t3code-nightly"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "test_image=local/t3code-nightly:$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing exact tag
        id: existing
        shell: bash
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE:$VERSION already exists."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build local test image
        if: steps.existing.outputs.build == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ steps.resolve.outputs.test_image }}
          build-args: |
            T3_VERSION=${{ steps.resolve.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        if: steps.existing.outputs.build == 'true'
        run: scripts/smoke.sh "${{ steps.resolve.outputs.test_image }}" "${{ steps.resolve.outputs.version }}"

      - name: Publish exact and moving tags
        if: github.event_name != 'pull_request' && steps.existing.outputs.build == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.resolve.outputs.image }}:${{ steps.resolve.outputs.version }}
            ${{ steps.resolve.outputs.image }}:nightly
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.resolve.outputs.version }}
          build-args: |
            T3_VERSION=${{ steps.resolve.outputs.version }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "## T3 Code nightly image"
            echo
            echo "- Version: \`${{ steps.resolve.outputs.version }}\`"
            echo "- Image: \`${{ steps.resolve.outputs.image }}\`"
            echo "- Build requested: \`${{ steps.existing.outputs.build || 'unknown' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
